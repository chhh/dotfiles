onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
cycle_pane_previous = ["cmd+[", "ctrl+alt+["]
cycle_pane_next = ["cmd+]", "ctrl+alt+]"]

# gc is the only launcher for agents: never resume them natively after a herdr server restart
[session]
resume_agents_on_restore = false
